# Runs the same tests as AGENTS.md on Bookworm's Python (3.11) and Trixie's (3.13).
name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install pillow numpy
    - name: Unit tests
      run: python -m unittest discover -s tests -t . -v
    - name: Wi-Fi hotspot script test
      run: bash tests/test_wifi_fallback.sh
